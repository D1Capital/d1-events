name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 89.104.94.114
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "deploy/docker-compose.shared-prod.yml,deploy/nginx.shared-prod.conf"
          target: /opt/d1-events/incoming
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 89.104.94.114
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
            cd /opt/d1-events

            install -m 600 \
              incoming/deploy/docker-compose.shared-prod.yml \
              docker-compose.yml

            # Certbot modifies this file after direct DNS cutover. Preserve the
            # managed TLS directives on subsequent application deploys.
            if [ ! -f /etc/nginx/sites-available/d1-events.conf ]; then
              install -m 644 \
                incoming/deploy/nginx.shared-prod.conf \
                /etc/nginx/sites-available/d1-events.conf
              ln -sfn \
                /etc/nginx/sites-available/d1-events.conf \
                /etc/nginx/sites-enabled/d1-events.conf
            fi

            test -s .env
            test -s /etc/nginx/sites-available/d1-events.conf
            docker volume inspect d1events_uploads >/dev/null

            image_repo=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            export IMAGE=${{ env.REGISTRY }}/$image_repo:latest
            compose="docker compose -p d1events --env-file .env -f docker-compose.yml"

            export DOCKER_CONFIG=/opt/d1-events/.docker-gha
            install -d -m 700 "$DOCKER_CONFIG"

            cleanup_registry_auth() {
              rm -f "$DOCKER_CONFIG/config.json"
              rmdir "$DOCKER_CONFIG" 2>/dev/null || true
            }
            trap cleanup_registry_auth EXIT

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            $compose pull app
            $compose up -d db

            docker run --rm \
              --network d1events_default \
              --env-file .env \
              --user 0 \
              --entrypoint sh \
              "$IMAGE" \
              -c "set -e; cd /app; NODE_PATH=/usr/local/lib/node_modules prisma db push --schema=prisma/schema.prisma"

            $compose up -d app
            nginx -t
            systemctl reload nginx

            for attempt in $(seq 1 30); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --max-time 5 \
                -H 'Host: tma.d1capital.ru' \
                http://127.0.0.1/ || true)
              [ "$code" = 200 ] && break
              sleep 2
            done

            test "$code" = 200
            $compose ps
