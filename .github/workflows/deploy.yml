name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: d1-events-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure pinned Production SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/d1events-deploy"
          chmod 600 "$HOME/.ssh/d1events-deploy"

          ssh-keyscan -t ed25519 89.104.94.114 2>/dev/null \
            > "$HOME/.ssh/known_hosts.pending"
          fingerprint=$(ssh-keygen -lf "$HOME/.ssh/known_hosts.pending" -E sha256 \
            | awk '{print $2}')
          test "$fingerprint" = "SHA256:jZJ1TKQjfzdF0morgmYTyqUcZX6Fy96vJXOfuZVwC2Y"
          mv "$HOME/.ssh/known_hosts.pending" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run constrained Production deployment
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          {
            printf '%s\n' "$GITHUB_ACTOR"
            printf '%s\n' "$GHCR_TOKEN"
          } | ssh \
            -i "$HOME/.ssh/d1events-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -T d1events-deploy@89.104.94.114

      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/d1events-deploy" "$HOME/.ssh/known_hosts"
